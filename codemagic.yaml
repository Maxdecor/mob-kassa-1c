workflows:
  android-apk:
    name: Mobil kassa APK
    max_build_duration: 40
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Gradle xotirasini oshirish
        script: |
          cd app
          sed -i '' 's/-Xmx1g/-Xmx3g/' android/gradle.properties
          sed -i '' 's/^org.gradle.daemon=false/org.gradle.daemon=true/' android/gradle.properties
      - name: Paketlar
        script: |
          cd app
          flutter pub get
      - name: Ikonkalar
        script: |
          cd app
          dart run flutter_launcher_icons
      - name: APK yig'ish
        script: |
          cd app
          flutter build apk --release
    artifacts:
      - app/build/app/outputs/flutter-apk/*.apk
