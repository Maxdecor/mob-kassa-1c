name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Kuchsiz kompyuter uchun yozilgan Gradle sozlamalarini serverda kengaytiramiz
      - name: Gradle xotirasini oshirish
        run: |
          sed -i 's/-Xmx1g/-Xmx3g/' android/gradle.properties
          sed -i 's/^org.gradle.daemon=false/org.gradle.daemon=true/' android/gradle.properties

      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: mobil-kassa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
