name: mob_kassa
description: Mobil kassa - 1C:UNF 3.0 uchun kassir ilovasi
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ">=2.3.0 <2.4.0"
  intl: ^0.19.0

dependency_overrides:
  shared_preferences_android: ">=2.3.0 <2.4.0"

dev_dependencies:
